<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17151a" />
  <title>Glean · 炉边</title>
  <link rel="stylesheet" href="./scene.css" />
</head>
<body>
  <main>
    <header><a href="/glean/" aria-label="返回 Glean">← GLEAN</a><span>A ROOM FOR READING</span></header>
    <section class="frame" aria-label="温暖的阅读房间动画">
      <canvas id="room" width="1280" height="800" role="img" aria-label="木屋里的温暖阅读角：燃烧的壁炉、松软的沙发、针织毯、摆着摊开书本的茶桌、书架和冒着热气的茶。窗外雪花慢慢落下。"></canvas>
      <div class="frame-corner corner-one"></div><div class="frame-corner corner-two"></div>
    </section>
    <footer>
      <div class="caption"><h1>炉边</h1><p>风雪留在窗外，今晚只读几页。</p></div>
      <div class="controls"><div class="modes" role="group" aria-label="画面风格"><button id="ascii" aria-pressed="true">字符</button><button id="pixel" aria-pressed="false">色块</button></div><button id="pause" aria-pressed="false">暂停动画</button></div>
    </footer>
  </main>
  <script type="module" src="./scene.js"></script>
</body>
</html>
